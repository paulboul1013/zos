# ZOS GRUB configuration (Multiboot v1).
#
# The kernel is the only payload in this first ISO.  No GRUB module is
# required; additional modules can be added here only when the kernel ABI
# explicitly introduces them.
set default=0
set timeout=3

menuentry "Zenc OS (i686)" {
    multiboot /boot/zenc-os.elf
}

# Optional serial-console setup.  Uncomment these lines when booting QEMU
# with `-serial stdio`; leaving them commented keeps the VGA console default.
# serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
# terminal_input --append serial console
# terminal_output --append serial console
